apiVersion: v1
kind: Namespace
metadata:
  name: astronomy-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: astronomy-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      annotations:
        # `kafka`: broker JMX metrics.
        # `kafka_consumer`: consumer lag and Datadog Kafka Console (requires Datadog Agent >= 7.84.0).
        # Configured as a regular pod check rather than a cluster check on the Service as
        # cluster checks are disabled in the DatadogAgent CR. A single instance monitors the
        # whole cluster: don't configure it on several brokers/clients.
        # See https://docs.datadoghq.com/integrations/kafka-consumer/
        ad.datadoghq.com/kafka.checks: |
          {
            "kafka_consumer": {
              "init_config": {
                "max_partition_contexts": 10000
              },
              "instances": [
                {
                  "kafka_connect_str": "%%host%%:9092",
                  "monitor_unlisted_consumer_groups": true,
                  "tags": [
                    "kafka_cluster_name:astronomy-store"
                  ],
                  "enable_kafka_console": true
                }
              ]
            },
            "kafka": {
              "init_config": {
                "is_jmx": true,
                "collect_default_metrics": true
              },
              "instances": [
                {
                  "host": "%%host%%",
                  "port": "9999"
                }
              ]
            }
          }
      labels:
        app.kubernetes.io/name: kafka
        # Skip Datadog Single Step Instrumentation if enabled cluster-wide: kafka isn't
        # instrumented by the OpenTelemetry Operator, avoid double instrumentation.
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            # Namespace-qualified so the Datadog Agent's Kafka admin client (`kafka_consumer` check),
            # running in the `datadog` namespace, can resolve the advertised broker address.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.astronomy-store:9092
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx400M -Xms400M"
            - name: KAFKA_JMX_OPTS
              value: >-
                -Dcom.sun.management.jmxremote
                -Dcom.sun.management.jmxremote.authenticate=false
                -Dcom.sun.management.jmxremote.ssl=false
                -Dcom.sun.management.jmxremote.local.only=false
                -Dcom.sun.management.jmxremote.port=9999
                -Dcom.sun.management.jmxremote.rmi.port=9999
                -Djava.rmi.server.hostname=$(POD_IP)
          ports:
            - name: plaintext
              containerPort: 9092
            - name: jmx
              containerPort: 9999
          readinessProbe:
            tcpSocket:
              port: plaintext
          livenessProbe:
            tcpSocket:
              port: plaintext
          resources:
            limits:
              memory: 700Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: astronomy-store
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
