apiVersion: v1
kind: Namespace
metadata:
  name: astronomy-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-forwarder
  namespace: astronomy-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dotnet-forwarder
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-dotnet: opentelemetry-operator-system/opentelemetry-kube-stack
        resource.opentelemetry.io/service.name: dotnet-forwarder
        resource.opentelemetry.io/service.namespace: astronomy-store
      labels:
        app.kubernetes.io/name: dotnet-forwarder
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
        - name: dotnet-forwarder
          image: astronomy-store/dotnet-forwarder:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_ADDR
              value: kafka:9092
            - name: KAFKA_TOPIC
              value: node-forwarder-orders
            - name: KAFKA_OUTPUT_TOPIC
              value: dotnet-forwarder-orders
