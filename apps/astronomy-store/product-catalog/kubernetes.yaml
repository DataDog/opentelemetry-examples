apiVersion: v1
kind: Namespace
metadata:
  name: astronomy-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: astronomy-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-dotnet: opentelemetry-operator-system/opentelemetry-kube-stack
        resource.opentelemetry.io/service-name: product-catalog
        resource.opentelemetry.io/service-namespace: astronomy-store
      labels:
        app.kubernetes.io/name: product-catalog
        # Skip Datadog Single Step Instrumentation if enabled cluster-wide: this pod is
        # already instrumented by the OpenTelemetry Operator, avoid double instrumentation.
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
        - name: product-catalog
          image: astronomy-store/product-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: astronomy-store
spec:
  selector:
    app.kubernetes.io/name: product-catalog
  ports:
    - name: http
      port: 8080
      targetPort: http
