apiVersion: v1
kind: Namespace
metadata:
  name: astronomy-store
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-load-generator-script
  namespace: astronomy-store
data:
  load-test.js: |
    import http from "k6/http";
    import encoding from "k6/encoding";
    import { check, sleep } from "k6";

    const frontendUrl = __ENV.FRONTEND_URL || "http://frontend:8080";
    const adUrl = __ENV.AD_URL || "http://ad:8080";
    const adUsername = __ENV.AD_USERNAME || "frontend.astronomy-store";
    const adPassword = __ENV.AD_PASSWORD || "changeme";

    export const options = {
      scenarios: {
        astronomy_store: {
          executor: "constant-vus",
          vus: 5,
          duration: "24h",
          gracefulStop: "1m",
        },
        // Low-rate simulated suspicious traffic sent straight to the ad service, to showcase Datadog App & API
        // Protection detections. See suspiciousAdTraffic below.
        suspicious_ad_traffic: {
          executor: "constant-arrival-rate",
          exec: "suspiciousAdTraffic",
          rate: 6,
          timeUnit: "1m",
          duration: "24h",
          preAllocatedVUs: 1,
          gracefulStop: "1m",
        },
      },
      // Only the regular shopper traffic is expected to succeed.
      thresholds: {
        "http_req_failed{scenario:astronomy_store}": ["rate<0.01"],
        "http_req_duration{scenario:astronomy_store}": ["p(95)<1000"],
      },
    };

    export default function () {
      const userId = `k6-user-${__VU}-${__ITER}`;
      const headers = { "content-type": "application/json" };

      const products = http.get(`${frontendUrl}/api/products`);
      check(products, {
        "frontend products returned": (response) => response.status === 200,
      });

      const ads = http.get(
        `${frontendUrl}/api/ads?context_keys=telescopes&context_keys=books`,
      );
      check(ads, {
        "frontend ads returned": (response) => response.status === 200,
      });

      const order = http.post(
        `${frontendUrl}/api/checkout`,
        JSON.stringify({
          user_id: userId,
          user_currency: "USD",
          address: {
            street_address: "123 Astronomy Way",
            city: "Paris",
            state: "Ile-de-France",
            country: "FR",
            zip_code: "75001",
          },
          email: `${userId}@example.com`,
          credit_card: {
            credit_card_number: "4111111111111111",
            credit_card_cvv: 123,
            credit_card_expiration_year: 2030,
            credit_card_expiration_month: 12,
          },
        }),
        { headers },
      );
      check(order, {
        "checkout order created": (response) => response.status === 201,
      });

      sleep(1);
    }

    function basicAuth(username, password) {
      return `Basic ${encoding.b64encode(`${username}:${password}`)}`;
    }

    // Harmless test requests that match App & API Protection's built-in detection rules: a known scanner
    // user agent and a benign "<script>alert(1)</script>" string in a query parameter (attack_attempt.attack_tool
    // and attack_attempt.xss), plus requests with a wrong Basic auth password (failed logins).
    export function suspiciousAdTraffic() {
      if (Math.random() < 0.5) {
        http.get(
          `${adUrl}/ad/get-ads?context_keys=telescopes&q=${encodeURIComponent("<script>alert(1)</script>")}`,
          {
            headers: {
              authorization: basicAuth(adUsername, adPassword),
              "user-agent": "sqlmap/1.7",
            },
            tags: { traffic: "suspicious" },
          },
        );
      } else {
        const response = http.get(`${adUrl}/ad/get-ads?context_keys=books`, {
          headers: { authorization: basicAuth(adUsername, "wrong-password") },
          responseCallback: http.expectedStatuses(401),
          tags: { traffic: "suspicious" },
        });
        check(response, {
          "ad rejects wrong password": (r) => r.status === 401,
        });
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-load-generator
  namespace: astronomy-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k6-load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6-load-generator
        # Skip Datadog Single Step Instrumentation if enabled cluster-wide: this is a test
        # traffic generator, not an instrumented workload.
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          args: ["run", "/scripts/load-test.js"]
          env:
            - name: FRONTEND_URL
              value: http://frontend:8080
            - name: AD_URL
              value: http://ad:8080
            - name: AD_USERNAME
              value: frontend.astronomy-store
            - name: AD_PASSWORD
              value: changeme
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: k6-load-generator-script
