apiVersion: v1
kind: Namespace
metadata:
  name: astronomy-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: astronomy-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: opentelemetry-operator-system/opentelemetry-kube-stack
        resource.opentelemetry.io/service-name: checkout
        resource.opentelemetry.io/service-namespace: astronomy-store
      labels:
        app.kubernetes.io/name: checkout
    spec:
      containers:
        - name: checkout
          image: astronomy-store/checkout:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /checkout/health
              port: http
          livenessProbe:
            httpGet:
              path: /checkout/health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: astronomy-store
spec:
  selector:
    app.kubernetes.io/name: checkout
  ports:
    - name: http
      port: 8080
      targetPort: http
