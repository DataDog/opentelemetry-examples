apiVersion: v1
kind: Namespace
metadata:
  name: astronomy-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-producer
  namespace: astronomy-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-producer
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-sdk: opentelemetry-operator-system/opentelemetry-kube-stack
        resource.opentelemetry.io/service.name: go-producer
        resource.opentelemetry.io/service.namespace: astronomy-store
      labels:
        app.kubernetes.io/name: go-producer
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
        - name: go-producer
          image: astronomy-store/go-producer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_ADDR
              value: kafka:9092
            - name: KAFKA_OUTPUT_TOPIC
              value: go-producer-orders
