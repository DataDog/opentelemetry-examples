plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.astronomystore'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('io.opentelemetry:opentelemetry-bom:1.45.0')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry.semconv:opentelemetry-semconv-incubating:1.44.0-alpha'
    implementation 'dev.openfeature:sdk:1.20.1'
    implementation 'com.datadoghq:dd-openfeature:1.67.1'
    implementation('dev.openfeature.contrib.hooks:otel:3.3.1') {
        exclude group: 'io.opentelemetry'
        exclude group: 'io.opentelemetry.semconv'
    }
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
