spring.datasource.url=${DB_URL:jdbc:postgresql://astronomy-db:5432/astronomy_db}
spring.datasource.username=${DB_USERNAME:astronomy_user}
spring.datasource.password=${DB_PASSWORD:astronomy_password}
# Don't fail pod startup if astronomy-db isn't ready yet; connect lazily on the first query instead.
spring.datasource.hikari.initialization-fail-timeout=0
# One Logstash-format JSON object per log line on stdout. MDC entries, such as the dd.trace_id and dd.span_id
# injected by dd-java-agent, are added as top-level fields for logs/traces correlation.
logging.structured.format.console=logstash
# Single hardcoded HTTP Basic user, used by the frontend service. Spring Boot registers it in an in-memory
# UserDetailsService; dd-java-agent reports the resulting Spring Security login success/failure events to
# Datadog App & API Protection.
spring.security.user.name=frontend.astronomy-store
spring.security.user.password=changeme
