name: opentelemetry-kube-stack shellcheck

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck \
            guides/kubernetes/configuration/opentelemetry-kube-stack/install \
            guides/kubernetes/configuration/opentelemetry-kube-stack/uninstall \
            guides/kubernetes/configuration/opentelemetry-kube-stack/render-examples \
            guides/kubernetes/configuration/opentelemetry-kube-stack/ddot/install \
            guides/kubernetes/configuration/opentelemetry-kube-stack/ddot/uninstall \
            .github/workflows/scripts/validate-opentelemetry-kube-stack.sh
