name: opentelemetry-kube-stack rendered examples

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "guides/kubernetes/configuration/opentelemetry-kube-stack/**"
      - ".github/workflows/kube-stack-examples.yml"
  push:
    branches: [ "main" ]
    paths:
      - "guides/kubernetes/configuration/opentelemetry-kube-stack/**"
      - ".github/workflows/kube-stack-examples.yml"

jobs:
  check-rendered-examples:
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v4.3.0
      YQ_VERSION: v4.49.2
    defaults:
      run:
        working-directory: guides/kubernetes/configuration/opentelemetry-kube-stack
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Helm version
        run: |
          curl -fsLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sha256sum -c "helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          tar xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "$PWD/linux-amd64" >> "$GITHUB_PATH"

      - name: Install pinned yq version
        run: |
          sudo curl -fsL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Add Helm repos
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add datadog https://helm.datadoghq.com
          helm repo update

      - name: Regenerate examples
        run: make generate-examples

      - name: Fail if generated values files or rendered examples are out of date
        run: |
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "::error::values-ddot.yaml, values-otlp-http.yaml, examples/*/rendered-* or examples-datadog-agent/*/rendered is out of date. Run make generate-examples locally with Helm ${HELM_VERSION} and yq ${YQ_VERSION}."
            git status -- .
            exit 1
          fi
