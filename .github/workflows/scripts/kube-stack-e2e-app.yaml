apiVersion: v1
kind: Pod
metadata:
  name: kube-stack-e2e
  namespace: default
  annotations:
    instrumentation.opentelemetry.io/inject-python: opentelemetry-operator-system/opentelemetry-kube-stack
spec:
  containers:
    - name: app
      image: python:3.14.10-slim
      command: ["python", "-c"]
      args:
        - |
          import sqlite3, time
          conn = sqlite3.connect(":memory:")
          while True:
              conn.cursor().execute("SELECT 1")
              time.sleep(1)
