apiVersion: v1
kind: Pod
metadata:
  name: jaeger
  namespace: default
  labels:
    app: jaeger
spec:
  containers:
    - name: jaeger
      image: jaegertracing/jaeger:2.23.0
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: default
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-http
      port: 4318
    - name: query
      port: 16686
