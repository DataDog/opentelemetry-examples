enabled: true
mode: daemonset

# Enabling presets automatically configures the necessary service accounts
# and sane defaults
presets:
  hostMetrics:
    enabled: true
  kubeletMetrics:
    enabled: true

extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: datadog-secret
        key: api-key
  - name: DD_SITE  # datadoghq.com, us3.datadoghq.com, datadoghq.eu... Defaults to datadoghq.com
    valueFrom:
      secretKeyRef:
        name: datadog-secret
        key: dd-site
        optional: true
service:
  enabled: true

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "nodes", "nodes/stats", "nodes/metrics"]
      verbs: ["get", "watch", "list"]
    - apiGroups: ["apps"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]

config:
  receivers:
    hostmetrics:
      root_path: /hostfs # Necessary inside containers, corresponds to / on host
      collection_interval: 10s
      scrapers:
        cpu:
          metrics:
            system.cpu.utilization:
              enabled: true
            system.cpu.physical.count:
              enabled: true
            system.cpu.logical.count:
              enabled: true
            system.cpu.frequency:
              enabled: true
        memory:
          metrics:
            system.memory.limit:
              enabled: true
        paging:
          metrics:
            system.paging.utilization:
              enabled: true
            system.paging.usage:
              enabled: true
        disk: {}
        filesystem:
          metrics:
            system.filesystem.utilization:
              enabled: true
        load: {}
        network: {}
        processes: {}

    kubeletstats:
      collection_interval: 15s
      auth_type: "serviceAccount"
      endpoint: "${env:K8S_NODE_NAME}:10250"
      node: "${env:K8S_NODE_NAME}"
      insecure_skip_verify: true
      metric_groups:
        - node
        - pod
        - container
        - volume

    # cAdvisor metrics from the kubelet
    prometheus:
      config:
        scrape_configs:
          - job_name: kubelet-cadvisor
            scheme: https
            metrics_path: /metrics/cadvisor
            scrape_interval: 15s
            scrape_timeout: 10s
            honor_labels: true
            honor_timestamps: true
            authorization:
              type: Bearer
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              insecure_skip_verify: true
            kubernetes_sd_configs:
              - role: node
                selectors:
                  - role: node
                    field: metadata.name=${K8S_NODE_NAME}
            relabel_configs:
              - action: replace
                replacement: kubelet
                target_label: job
              - action: replace
                source_labels: [__meta_kubernetes_node_name]
                target_label: node
            metric_relabel_configs:
              # Drop the highest-cardinality / lowest-value cAdvisor series.
              # Adapted from https://github.com/open-telemetry/opentelemetry-helm-charts/blob/116378e5b1985029de91d9aea2d1cce319f4e016/charts/opentelemetry-kube-stack/templates/_config.tpl#L826-L847
              - source_labels: [__name__]
                regex: container_cpu_(load_average_10s)
                action: drop
              - source_labels: [__name__]
                regex: container_fs_(io_current|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
                action: drop
              - source_labels: [__name__]
                regex: container_memory_(mapped_file|swap)
                action: drop
              - source_labels: [__name__]
                regex: container_(file_descriptors|tasks_state|threads_max)
                action: drop
              - source_labels: [__name__]
                regex: container_spec_(cpu_period|cpu_quota|cpu_shares|memory_reservation_limit_bytes|memory_swap_limit_bytes)
                action: drop
              - source_labels: [__name__]
                regex: container_network_.*
                action: drop
              # Drop series where the cgroup id is set but the pod label is empty
              # (non-pod cgroups like system.slice and the kubelet's own resources).
              - source_labels: [id, pod]
                regex: .+;
                action: drop
              # Ignore the non-container metrics (from the cgroup or sandbox)
              - source_labels: [container]
                regex: ""
                action: drop

  processors:
    cumulativetodelta: {}
    deltatorate:
      metrics:
        - k8s.pod.network.io
        - k8s.pod.network.errors

    deltatorate/cadvisor:
      metrics:
        - container_cpu_usage_seconds_total
        - container_cpu_cfs_periods_total
        - container_cpu_cfs_throttled_periods_total
        - container_cpu_cfs_throttled_seconds_total
        - container_cpu_system_seconds_total
        - container_cpu_user_seconds_total
        - container_fs_reads_bytes_total
        - container_fs_writes_bytes_total

    transform/cadvisor_labels:
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"] != nil
            - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil
            - set(attributes["k8s.container.name"], attributes["container"]) where attributes["container"] != nil
            - set(attributes["container.id"], attributes["name"]) where attributes["container"] != nil
            - set(attributes["container.image.name"], attributes["image"]) where attributes["container"] != nil
            - delete_key(attributes, "pod")
            - delete_key(attributes, "namespace")
            - delete_key(attributes, "container")
            - delete_key(attributes, "name")
            - delete_key(attributes, "image")
            - delete_key(attributes, "id")

    # Ref: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/821a9d9c2c1623c4a0ceba5d47b57c48879c3f84/processor/groupbyattrsprocessor
    # Prometheus metrics are flat, so we need to extract the resource from the datapoint labels
    groupbyattrs:
      keys:
        - k8s.pod.name
        - k8s.namespace.name
        - k8s.container.name
        - container.id

    k8s_attributes:
      auth_type: "serviceAccount"
      extract:
        otel_annotations: true
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.replicaset.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.container.name
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
          - container.id
          - container.image.name
          - container.image.tag
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: resource_attribute
              name: k8s.pod.name
            - from: resource_attribute
              name: k8s.namespace.name
        - sources:
            - from: connection

    # Detects k8s.cluster.name (gcp, eks, aks) and k8s.cluster.uid (k8s_api).
    # Adjust the k8s.cluster.name settings below for your cloud provider.
    # If your cloud provider is not supported, use the optional resource/add-cluster-name processor below instead.
    # See: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/v0.153.0/processor/resourcedetectionprocessor#cluster-name
    resourcedetection:
      detectors: ["k8s_api", "ec2", "eks", "aks", "gcp"]
      override: false
      eks:
        resource_attributes:
          k8s.cluster.name:
            enabled: true
      aks:
        resource_attributes:
          k8s.cluster.name:
            enabled: true
      gcp:
        resource_attributes:
          k8s.cluster.name:
            enabled: true

    # Manually inject the cluster name if your cloud provider is not supported by the resourcedetection processor.
    # resource/add-cluster-name:
    #   attributes:
    #     - key: k8s.cluster.name
    #       value: <YOUR_CLUSTER_NAME>
    #       action: upsert

    memory_limiter:
      check_interval: 5s
      limit_percentage: 75
      spike_limit_percentage: 15

  connectors:
    datadog/connector: {}

  exporters:
    datadog/exporter:
      api:
        key: ${env:DD_API_KEY}
        site: ${env:DD_SITE:-datadoghq.com}

  extensions:
    datadog:
      api:
        key: ${env:DD_API_KEY}
        site: ${env:DD_SITE:-datadoghq.com}
      deployment_type: daemonset

  service:
    extensions:
      - health_check
      - datadog

    pipelines:
      logs:
        receivers: [otlp]
        processors: [resourcedetection, k8s_attributes]
        exporters: [datadog/exporter]

      traces:
        receivers: [otlp]
        processors: [resourcedetection, k8s_attributes]
        exporters: [datadog/connector]

      traces/sampling:
        receivers: [datadog/connector]
        # Perform any sampling here
        exporters: [datadog/exporter]

      metrics:
        receivers: [datadog/connector, otlp]
        processors:
          [resourcedetection, k8s_attributes, cumulativetodelta, deltatorate]
        exporters: [datadog/exporter]

      metrics/cadvisor:
        receivers: [prometheus]
        processors:
          [
            resourcedetection,
            transform/cadvisor_labels,
            groupbyattrs,
            k8s_attributes,
            cumulativetodelta,
            deltatorate/cadvisor,
          ]
        exporters: [datadog/exporter]
