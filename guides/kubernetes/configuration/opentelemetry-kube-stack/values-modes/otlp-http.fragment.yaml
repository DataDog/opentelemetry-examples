# Exporter-mode fragment: OTLP/HTTP (vendor-neutral protocol to Datadog's
# OTLP intake) + upstream OpenTelemetry auto-instrumentation SDKs. Merged onto
# ../values-common.yaml by `make generate-base-values` to produce
# ../values-otlp-http.yaml.

opentelemetry-operator:
  manager:
    collectorImage:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.154.0"

defaultCRConfig:
  env:
    - name: DD_API_KEY
      valueFrom:
        secretKeyRef:
          name: datadog-secret
          key: api-key
    - name: DD_SITE  # e.g. datadoghq.com, us3.datadoghq.com, datadoghq.eu. Defaults to datadoghq.com.
      valueFrom:
        secretKeyRef:
          name: datadog-secret
          key: dd-site
          optional: true
  config:
    exporters:
      otlp_http:
        endpoint: https://otlp.${env:DD_SITE:-datadoghq.com}
        headers:
          dd-api-key: ${env:DD_API_KEY}
          # Maps resource attributes and instrumentation scope metadata to Datadog metric tags.
          dd-otel-metric-config: >-
            {
            "resource_attributes_as_tags": true,
            "instrumentation_scope_metadata_as_tags": true
            }
        compression: zstd
        compression_params:
          level: 3
        sending_queue:
          batch:
            sizer: bytes
            min_size: 2097152
            max_size: 4194304

collectors:
  cluster:
    config:
      service:
        pipelines:
          logs:
            exporters: [otlp_http]
          metrics/otel_operator:
            exporters: [otlp_http]
          metrics:
            exporters: [otlp_http]

  daemon:
    config:
      connectors:
        # Separate trace processing from span-metrics generation so RED metrics are computed on all traces.
        forward: {}
        span_metrics:
          aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
          add_resource_attributes: true
          histogram:
            exponential: {}
            unit: s
          # Only span-level (per-call) attributes are listed here. Resource-level semconv
          # attributes (deployment.environment.name, service.version, container.id, cloud.*,
          # host.*, k8s.node.name, k8s.cluster.name, azure.resourcegroup.name, aws.ecs.*) are
          # already promoted onto the generated metrics' resource by add_resource_attributes
          # above, and this pipeline's otlp_http exporter turns those into Datadog tags via
          # dd-otel-metric-config.resource_attributes_as_tags, so listing them again here would
          # be redundant. Namespace globs (e.g. `- glob: "http.*"`, `- glob: "db.**"`) were
          # considered but skipped: several namespaces below (http, db, messaging, rpc, faas)
          # have other semconv attributes that are high-cardinality (query text, message/request
          # IDs, byte sizes, ports) and would blow up dimension cardinality if swept in.
          dimensions:
            - name: http.response.status_code
            - name: aws.s3.bucket
            - name: db.namespace
            - name: messaging.destination.name
            - name: messaging.system
            - name: server.address
            - name: operation.name
            - name: http.request.method
            - name: http.method
            - name: db.system
            - name: messaging.operation
            - name: rpc.system
            - name: rpc.service
            - name: faas.invoked_provider
            - name: faas.invoked_name
            - name: faas.trigger
            - name: graphql.operation.type
            - name: network.protocol.name
            - name: resource.name
            - name: http.route
            - name: messaging.destination
            - name: rpc.method
            - name: graphql.operation.name
            - name: db.statement
            - name: db.query.text
      service:
        pipelines:
          logs:
            exporters: [otlp_http]
          traces:
            exporters: [forward, span_metrics]
          # Add sampling processors here if needed.
          traces/sampling:
            receivers: [forward]
            exporters: [otlp_http]
          metrics/span_metrics:
            receivers: [span_metrics]
            exporters: [otlp_http]
          metrics:
            receivers: [otlp]
            exporters: [otlp_http]
          metrics/cadvisor:
            exporters: [otlp_http]

instrumentation:
  env:
    - name: OTEL_SEMCONV_STABILITY_OPT_IN
      value: "http,database,rpc,messaging"
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: delta
    # Node.js defaults to gRPC; use HTTP so every service exports to port 4318.
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
  dotnet:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.15.0
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.28.1
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.77.0
  python:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.64b0
