# --- Set by CLI args ---
#datadog:
#  apiKeyExistingSecret: datadog-secret
#  clusterName: <...>
#  site: <...>

# We want live debugger & dynamic instrumentation
# but don't need the cluster agent & k8s monitoring (done by the OTel collector)
datadog:
  # Uncomment if you have Go apps to instrument:
  #dynamicInstrumentationGo:
  #  enabled: true
  discovery:
    enabled: false # no-op on agent >= 7.78.0, real switch is DD_DISCOVERY_ENABLED below
  operator:
    enabled: false
  clusterChecks:
    enabled: false
  kubeStateMetricsCore:
    enabled: false
  orchestratorExplorer:
    enabled: false
    kubelet_configuration_check:
      enabled: false # no-op in the chart, real switch is the env var below
  processAgent:
    enabled: false
  collectEvents: false
  env:
    - name: DD_ORCHESTRATOR_EXPLORER_KUBELET_CONFIG_CHECK_ENABLED
      value: 'false'
    - name: DD_DISCOVERY_ENABLED
      value: 'false'
# Could be enabled to get the admission controller.
# else DD_AGENT_HOST or unix socket mount must be configured on app pods manually
clusterAgent:
  enabled: false
  #admissionController:
  #  enabled: true           # default true once clusterAgent is on
  #  mutateUnlabelled: false # only mutate pods opted-in via label (recommended)
  #  configMode: hostip
  ## configMode controls HOW connection info is injected:
  ##  hostip  -> DD_AGENT_HOST = node IP (downward API)
  ##  socket  -> mounts the APM/DogStatsD UDS socket
  ##  service -> DD_AGENT_HOST = cluster agent service DNS

