clusterName: ""
opentelemetry-operator:
  manager:
    collectorImage:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.154.0"

kubeStateMetrics:
  enabled: true
kube-state-metrics:
  fullnameOverride: kube-state-metrics

# Shared defaults merged into every collector. env detector stays off (it
# would stamp the collector pod's identity on incoming telemetry); for clouds
# not supported by the resource detection processor, set k8s.cluster.name via
# a resource/cluster processor (see README).
defaultCRConfig:
  env:
    - name: DD_API_KEY
      valueFrom:
        secretKeyRef:
          name: datadog-secret
          key: api-key
    - name: DD_SITE  # e.g. datadoghq.com, us3.datadoghq.com, datadoghq.eu. Defaults to datadoghq.com.
      valueFrom:
        secretKeyRef:
          name: datadog-secret
          key: dd-site
          optional: true
    - name: OTEL_K8S_CLUSTER_NAME
      value: ""

  # Starting-point resource allocation. Scale up for large clusters.
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 500Mi
  presets:
    kubernetesAttributes:
      enabled: true
    resourceDetection:
      k8s_api:
        enabled: true
      eks:
        enabled: false
      aks:
        enabled: false
      gcp:
        enabled: false
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      cumulativetodelta: {}
      resource_detection/env:
        override: false
      transform/insert_k8s_cluster_name:
        # waiting for https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/49970
        # that will let us leverage the `k8s.cluster.name` defined as a collector env variable,
        # use a dedicated processor to insert `k8s.cluster.name` in the resource attributes if not already set by the resource detection processor.
        metric_statements:
          - set(resource.attributes["k8s.cluster.name"], "${env:OTEL_K8S_CLUSTER_NAME}") 
            where 
              (resource.attributes["k8s.cluster.name"] == nil or resource.attributes["k8s.cluster.name"] == "")
              and "${env:OTEL_K8S_CLUSTER_NAME}" != ""
        log_statements:
          - set(resource.attributes["k8s.cluster.name"], "${env:OTEL_K8S_CLUSTER_NAME}") 
            where 
              (resource.attributes["k8s.cluster.name"] == nil or resource.attributes["k8s.cluster.name"] == "")
              and "${env:OTEL_K8S_CLUSTER_NAME}" != ""
        trace_statements:
          - set(resource.attributes["k8s.cluster.name"], "${env:OTEL_K8S_CLUSTER_NAME}") 
            where 
              (resource.attributes["k8s.cluster.name"] == nil or resource.attributes["k8s.cluster.name"] == "")
              and "${env:OTEL_K8S_CLUSTER_NAME}" != ""
    exporters:
      datadog/exporter:
        api:
          key: ${env:DD_API_KEY}
          site: ${env:DD_SITE:-datadoghq.com}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      datadog:
        api:
          key: ${env:DD_API_KEY}
          site: ${env:DD_SITE:-datadoghq.com}
        deployment_type: gateway
    service:
      extensions: [health_check, datadog]
      # Loop collector metrics through the OTLP receiver for unified tagging.
      # Logs are picked up by the daemon's filelog receiver — no loopback (avoids dup).
      telemetry:
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://localhost:4318

collectors:

  cluster:
    enabled: true
    suffix: cluster
    mode: deployment
    replicas: 1

    presets:
      kubernetesObjects:
        enabled: true
        watch: true
      clusterMetrics:
        enabled: true

    config:
      receivers:
        # Override the kubernetesObjects preset's default 1h interval.
        k8s_objects:
          interval: 3m

        prometheus/ksm:
          config:
            scrape_configs:
              - job_name: "kube-state-metrics"
                metrics_path: /metrics
                scheme: http
                static_configs:
                  - targets:
                      - kube-state-metrics:8080
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: "kube_cronjob_.*|kube_daemonset_.*|kube_deployment_.*|kube_job_.*|kube_namespace_created|kube_node_.*|kube_pod_.*|kube_replicaset_.*|kube_statefulset_.*|kube_service_spec_type"
                    action: keep

        prometheus/otel_operator:
          config:
            scrape_configs:
              - job_name: "opentelemetry-operator"
                metrics_path: /metrics
                scheme: https
                tls_config:
                  insecure_skip_verify: true
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                static_configs:
                  - targets:
                      - opentelemetry-kube-stack-opentelemetry-operator:8443

      processors:
        # Rename the prometheus `uid` label to k8s.pod.uid (OTel standard),
        # required for the groupbyattrs step below.
        transform/rename_uid:
          metric_statements:
            - context: datapoint
              statements:
                - set(attributes["k8s.pod.uid"], attributes["uid"])
                - delete_key(attributes, "uid")
            # Prometheus receiver sets these on the resource incorrectly;
            # k8s_attributes cannot overwrite them (override: false), so drop first.
            - context: resource
              statements:
                - delete_key(attributes, "service.name")
                - delete_key(attributes, "service.instance.id")

        groupbyattrs:
          keys: [k8s.pod.uid]

        # Rewrite KSM datapoint attributes to Datadog tag names.
        transform/ksm_to_dd:
          metric_statements:
            - context: datapoint
              statements:
                - set(attributes["kube_namespace"], attributes["namespace"])
                - delete_key(attributes, "namespace")
                - set(attributes["kube_deployment"], attributes["deployment"])
                - delete_key(attributes, "deployment")
                - set(attributes["pod_phase"], attributes["phase"])
                - delete_key(attributes, "phase")
                - set(attributes["kube_stateful_set"], attributes["statefulset"])
                - delete_key(attributes, "statefulset")
                - set(attributes["kube_daemon_set"], attributes["daemonset"])
                - delete_key(attributes, "daemonset")
                - set(attributes["kube_replica_set"], attributes["replicaset"])
                - delete_key(attributes, "replicaset")
                - set(attributes["kube_job"], attributes["job_name"])
                - delete_key(attributes, "job_name")
                - set(attributes["kube_service"], attributes["service"])
                - delete_key(attributes, "service")
                - set(attributes["kube_cronjob"], attributes["cronjob"])
                - delete_key(attributes, "cronjob")

        # Pin pod_association to k8s.pod.uid so KSM metrics are associated
        # with their target pod (uid set by transform/rename_uid), not the
        # KSM pod itself via ip/name fallbacks from the preset default.
        k8s_attributes:
          pod_association:
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid

        transform/sum_to_gauge:
          metric_statements:
            - convert_sum_to_gauge() where metric.name == "k8s.service.count"
            - convert_sum_to_gauge() where metric.name == "k8s.node.count"
            - convert_sum_to_gauge() where metric.name == "k8s.job.count"
            - convert_sum_to_gauge() where metric.name == "k8s.deployment.count"
            - convert_sum_to_gauge() where metric.name == "k8s.pod.count"
            - convert_sum_to_gauge() where metric.name == "k8s.namespace.count"
            - convert_sum_to_gauge() where metric.name == "k8s.statefulset.count"
            - convert_sum_to_gauge() where metric.name == "k8s.daemonset.count"
            - convert_sum_to_gauge() where metric.name == "k8s.cronjob.count"

      connectors:
        count/k8s_entities:
          datapoints:
            k8s.service.count:
              attributes:
                - key: namespace
                  default_value: unspecified_namespace
                - key: type
                  default_value: unspecified_service_type
              conditions: [metric.name == "kube_service_spec_type"]
            k8s.node.count:
              conditions: [metric.name == "kube_node_info"]
            k8s.job.count:
              attributes:
                - key: namespace
                  default_value: unspecified_namespace
              conditions: [metric.name == "kube_job_owner"]
            k8s.deployment.count:
              attributes:
                - key: namespace
                  default_value: unspecified_namespace
              conditions: [metric.name == "kube_deployment_created"]
            k8s.pod.count:
              attributes:
                - key: namespace
                  default_value: unspecified_namespace
              conditions: [metric.name == "kube_pod_info"]
            k8s.namespace.count:
              conditions: [metric.name == "kube_namespace_created"]
            k8s.statefulset.count:
              attributes:
                - key: namespace
                  default_value: unspecified_namespace
              conditions:
                - metric.name == "kube_statefulset_created"
            k8s.daemonset.count:
              attributes:
                - key: namespace
                  default_value: unspecified_namespace
              conditions:
                - metric.name == "kube_daemonset_created"
            k8s.cronjob.count:
              attributes:
                - key: namespace
                  default_value: unspecified_namespace
              conditions:
                - metric.name == "kube_cronjob_info"

      exporters:
        datadog/exporter:
          orchestrator_explorer:
            enabled: true

      service:
        pipelines:
          logs:
            receivers: [k8s_objects]
            processors: [resource_detection/env, transform/insert_k8s_cluster_name]
            exporters: [datadog/exporter]

          metrics/otel_operator:
            receivers: [prometheus/otel_operator]
            processors:
              - resource_detection/env
              - transform/insert_k8s_cluster_name
              - cumulativetodelta
            exporters: [datadog/exporter]

          metrics/count:
            receivers: [prometheus/ksm]
            exporters: [count/k8s_entities]

          metrics:
            receivers: [otlp, prometheus/ksm, count/k8s_entities]
            processors:
              - transform/ksm_to_dd
              - transform/rename_uid
              - groupbyattrs
              - k8s_attributes
              - resource_detection/env
              - transform/insert_k8s_cluster_name
              - cumulativetodelta
              - transform/sum_to_gauge
            exporters: [datadog/exporter]

  daemon:
    # Disable the chart-default daemon_scrape_configs.yaml Prometheus scrape.
    scrape_configs_file: ""

    # Chart's daemon defaults set lower limits; raise to match defaultCRConfig.
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 500Mi

    presets:
      kubernetesEvents:
        enabled: false
      clusterMetrics:
        enabled: false
      kubeletMetrics:
        enabled: true
      hostMetrics:
        enabled: true
      # Chart's daemon defaults enable env disable it.
      # env would stamp the collector pod's own identity (k8s.pod.name/namespace/ip,
      # node.name, host.name) on incoming telemetry.
      resourceDetection:
        env:
          enabled: false

    config:
      processors:
        deltatorate:
          metrics:
            - k8s.pod.network.io
            - k8s.pod.network.errors

      connectors:
        datadog/connector: {}

      extensions:
        datadog:
          deployment_type: daemonset

      service:
        pipelines:
          logs:
            receivers: [otlp]
            processors: [resource_detection/env, transform/insert_k8s_cluster_name]
            exporters: [datadog/exporter]

          traces:
            receivers: [otlp]
            processors: [resource_detection/env, transform/insert_k8s_cluster_name]
            exporters: [datadog/connector]

          # Add sampling processors here if needed.
          traces/sampling:
            receivers: [datadog/connector]
            exporters: [datadog/exporter]

          metrics:
            receivers: [datadog/connector, otlp]
            processors:
              - resource_detection/env
              - transform/insert_k8s_cluster_name
              - cumulativetodelta
              - deltatorate
            exporters: [datadog/exporter]
instrumentation:
  enabled: true
  env:
    - name: OTEL_SEMCONV_STABILITY_OPT_IN
      value: "http,database,rpc,messaging"
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: delta
    # Node.js defaults to gRPC; use HTTP so every service exports to port 4318.
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    ## DDOT SDKs SPECIFIC CONFIGURATION
    ## Enable the OTel Mode on DDOT SDKs
    - name: "OTEL_TRACES_EXPORTER"
      value: "otlp"
    - name: "DD_TRACE_OTEL_ENABLED"
      value: "true"
    - name: "DD_LOGS_OTEL_ENABLED"
      value: "true"
    - name: "DD_METRICS_OTEL_ENABLED"
      value: "true"
    # DD_OTEL_SDK_ENABLED: Candidate new env var to enable OTel mode on DDOT SDKs, replacing all the previous ones,
    # but not yet supported by the DDOT SDKs
    # - name: "DD_OTEL_SDK_ENABLED"
    #  value: "true"
    ## DDOT CONFIGURATION
    - name: "DD_AGENT_HOST"
      value: "ddagent-kube-stack-datadog.opentelemetry-operator-system.svc.cluster.local"
  exporter:
    # Daemon collector Service DNS. Update the collector name and namespace
    # to match your install: http://<helm-release-name>-daemon-collector.<namespace>.svc.cluster.local:4318
    endpoint: http://opentelemetry-kube-stack-daemon-collector.opentelemetry-operator-system.svc.cluster.local:4318
  resource:
    resourceAttributes:
      deployment.environment.name: production # overwrite as needed
  sampler:
    type: parentbased_always_on
  # The opentelemetry-kube-stack Helm chart renders language sections even when empty, preventing the
  # Operator from falling back to its default agent image and yielding invalid init containers.
  # TODO: File an issue against the opentelemetry-kube-stack Helm chart for this behavior.
  dotnet:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.15.0
  java:
    # image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.28.1
    image: ghcr.io/cyrille-leclerc/dd-autoinstrumentation-java:1.64.2
  nodejs:
    # image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.77.0
    image: ghcr.io/cyrille-leclerc/dd-autoinstrumentation-nodejs:6.6.0
  python:
    # image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.64b0
    image: ghcr.io/cyrille-leclerc/dd-autoinstrumentation-python:4.11.1
    # The auto-instrumentation init container bundles ddtrace native builds for every supported
    # Python version (3.9-3.14) x libc (glibc/musl) x arch (x86_64/aarch64), ~330MB total, which
    # exceeds the Operator's 200Mi default EmptyDir limit and gets the pod evicted.
    volumeLimitSize: 500Mi
