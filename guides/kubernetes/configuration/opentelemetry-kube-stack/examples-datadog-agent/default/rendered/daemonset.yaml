# Source: datadog/templates/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ddagent-kube-stack-datadog
  namespace: opentelemetry-operator-system
  labels:
    helm.sh/chart: 'datadog-3.240.0'
    app.kubernetes.io/name: "ddagent-kube-stack-datadog"
    app.kubernetes.io/instance: "ddagent-kube-stack-datadog-agent"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: opentelemetry--operator--system-ddagent--kube--stack--datadog
    app.kubernetes.io/version: "7"
    app.kubernetes.io/component: agent
    agent.datadoghq.com/component: agent
    
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ddagent-kube-stack-datadog
  template:
    metadata:
      labels:
        
        app.kubernetes.io/name: "ddagent-kube-stack-datadog"
        app.kubernetes.io/instance: "ddagent-kube-stack-datadog-agent"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: opentelemetry--operator--system-ddagent--kube--stack--datadog
        app.kubernetes.io/component: agent
        admission.datadoghq.com/enabled: "false"
        app: ddagent-kube-stack-datadog
        agent.datadoghq.com/component: agent
        
      name: ddagent-kube-stack-datadog
      annotations:
