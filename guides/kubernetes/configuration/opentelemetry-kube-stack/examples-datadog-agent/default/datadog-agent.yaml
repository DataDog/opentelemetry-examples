# Datadog Operator CRD equivalent of ./dd-agent-values.yaml (Helm chart values).
# Both configure the Datadog Agent to run alongside the OpenTelemetry Kube Stack:
# the OTel collectors handle Kubernetes object/metrics monitoring and log collection,
# so cluster checks, orchestrator explorer, KSM core, process collection, and the
# Cluster Agent itself are disabled here to avoid duplicate collection.
kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
  annotations:
    # The Instrumentation CRD controller feature is enabled by default and requires a live
    # Cluster Agent (disabled below). Left on, the core agent's "instrumentation-checks" config
    # provider polls a Cluster Agent that doesn't exist and logs "temporary failure in
    # clusterAgentClient" errors every ~10s. See https://github.com/DataDog/datadog-operator/issues/3521
    agent.datadoghq.com/instrumentation-crd-enabled: "false"
spec:
  global:
    # datadoghq.com and the cluster name placeholder are substituted by the `install` script, which
    # removes the `clusterName` line on EKS/GKE/AKS so the Agent auto-detects the cluster name.
    clusterName: "my_k8s_cluster"
    site: "datadoghq.com"
    credentials:
      apiSecret:
        secretName: "datadog-secret"
        keyName: "api-key"
  features:
    clusterChecks:
      enabled: false
    orchestratorExplorer:
      enabled: false
    kubeStateMetricsCore:
      enabled: false
    liveProcessCollection:
      enabled: false
    processDiscovery:
      enabled: false
    eventCollection:
      collectKubernetesEvents: false
    # The admission controller runs in the Cluster Agent (disabled below), so it can't work here.
    # Left on (the default), the Operator still creates an unused `datadog-admission-controller`
    # Service and adds admission controller rules to the Cluster Agent RBAC.
    # See https://github.com/DataDog/datadog-operator/issues/3521
    admissionController:
      enabled: false
    # No log collection by the Agent: the OTel Kube Stack daemon collector handles logs.
    logCollection:
      enabled: false
    # No APM single-step (auto) instrumentation: SDKs are injected via the OTel Operator instead.
    apm:
      instrumentation:
        # CAN BE DISABLED WHEN INSTRUMENTING WITH THE OPENTELEMETRY OPERATOR, CAN BE ENABLED FOR HYBRID OTEL AND DATADOG
        # NATIVE INSTRUMENTATION. ENABLING DD INSTRUMENTATION REQUIRES EXCLUDING PODS THAT ARE INJECTED WITH OTEL SDKS
        # BY THE OPENTELEMETRY OPERATOR FROM DD INSTRUMENTATION, OTHERWISE THE SAME POD WILL BE INSTRUMENTED TWICE.
        #
        # The OpenTelemetry Operator marks pods for injection with the
        # "instrumentation.opentelemetry.io/inject-*" pod ANNOTATIONS, but the target's
        # `podSelector` below only matches pod LABELS (it's a plain Kubernetes label
        # selector, and Datadog's admission controller only ever reads pod.Labels, never
        # pod.Annotations) — so a podSelector keyed on those annotation names can never
        # exclude anything. To exclude an OTel-instrumented pod template from Datadog
        # auto-instrumentation, add this label to it directly, alongside the OTel
        # annotations: `admission.datadoghq.com/enabled: "false"`. That label bypasses
        # Datadog's admission controller entirely, with no selector needed.
        enabled: false
        targets:
          - name: "default-target"
            ddTraceVersions:
              java: "1"
              python: "4"
              js: "5"
              php: "1"
              dotnet: "3"
              ruby: "2"
            ddTraceConfigs:
              ## PROFILING SUPPORT
              - name: "DD_PROFILING_ENABLED"
                value: "auto"
              ## DBM SUPPORT
              - name: "DD_DBM_PROPAGATION_MODE"
                value: "full"
              - name: "DD_DBM_TRACE_PREPARED_STATEMENTS"
                value: "true"
              # DSM SUPPORT
              - name: "DD_DATA_STREAMS_ENABLED"
                value: "true"
              - name: "DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED"
                value: "true"
    dynamicInstrumentation:
      enabled: true
  override:
    # Cluster Agent not needed: Kubernetes monitoring is done by the OTel collectors.
    clusterAgent:
      disabled: true
    nodeAgent:
      # -jmx variant bundles a JRE so JMXFetch can run JMX checks (e.g. Kafka `ad.datadoghq.com/kafka.checks`).
      image:
        tag: "7.83.2-jmx"
      # The Operator's default env vars always point node agent containers at the Cluster
      # Agent (DD_CLUSTER_AGENT_ENABLED=true, DD_CLUSTER_AGENT_KUBERNETES_SERVICE_NAME=
      # datadog-cluster-agent, DD_KUBERNETES_USE_ENDPOINT_SLICES=true), regardless of
      # `override.clusterAgent.disabled` above. Since the Cluster Agent workload doesn't exist
      # here, its Service has no endpoints, so every node agent container must explicitly
      # disable that client to avoid repeatedly trying to reach an unavailable Cluster Agent
      # (DD_CLUSTER_AGENT_ENABLED) and hitting the API server directly for endpointslices
      # without the RBAC to list them cluster-wide (DD_KUBERNETES_USE_ENDPOINT_SLICES).
      # Upstream bug: https://github.com/DataDog/datadog-operator/issues/3521
      containers:
        agent:
          env:
            - name: "DD_ORCHESTRATOR_EXPLORER_KUBELET_CONFIG_CHECK_ENABLED"
              value: "false"
            - name: "DD_DISCOVERY_ENABLED"
              value: "false"
            - name: "DD_APM_DEBUGGER_LOGS_ENABLED_OVERRIDE"
              value: "true"
            - name: "DD_DYNAMIC_INSTRUMENTATION_ENABLED"
              value: "true"
            # The legacy `kubernetes_state` check's auto_conf.yaml autodiscovers the OTel Kube
            # Stack's kube-state-metrics pod and scrapes it, duplicating the Kubernetes object
            # metrics the OTel collectors already collect (hence `kubeStateMetricsCore` disabled above).
            - name: "DD_IGNORE_AUTOCONF"
              value: "kubernetes_state"
            - name: "DD_CLUSTER_AGENT_ENABLED"
              value: "false"
            - name: "DD_KUBERNETES_USE_ENDPOINT_SLICES"
              value: "false"
        trace-agent:
          env:
            - name: "DD_CLUSTER_AGENT_ENABLED"
              value: "false"
            - name: "DD_KUBERNETES_USE_ENDPOINT_SLICES"
              value: "false"
        system-probe:
          env:
            - name: "DD_CLUSTER_AGENT_ENABLED"
              value: "false"
            - name: "DD_KUBERNETES_USE_ENDPOINT_SLICES"
              value: "false"
        init-config:
          env:
            - name: "DD_CLUSTER_AGENT_ENABLED"
              value: "false"
            - name: "DD_KUBERNETES_USE_ENDPOINT_SLICES"
              value: "false"

