# Optional egress NetworkPolicy for the host-profiler collector DaemonSet.
# The chart leaves network policy enforcement to the cluster; apply this
# manifest on default-deny clusters whose CNI enforces NetworkPolicy:
#   kubectl apply -f host-profiler-network-policy.yaml
#
# Mirror of datadog-agent
# cmd/host-profiler/deploy/standalone/helm/network-policy-values.yaml.
#
# The selector matches the pods of the `host-profiler` collector created by
# the opentelemetry-kube-stack release. The OpenTelemetry Operator labels
# collector pods app.kubernetes.io/name: <CR-name>-collector.
#
# This NetworkPolicy allows DNS, Datadog intake egress, and kubelet API
# access required by the host profiler.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opentelemetry-kube-stack-host-profiler-egress
  namespace: opentelemetry-operator-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-kube-stack-host-profiler-collector
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
    - ports:
        - port: 10250
          protocol: TCP
