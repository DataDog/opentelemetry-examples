---
# Source: opentelemetry-kube-stack/templates/instrumentation.yaml
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: opentelemetry-kube-stack
  labels:
    helm.sh/chart: opentelemetry-kube-stack-0.20.2
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    release: "opentelemetry-kube-stack"    
spec:
  exporter:
    endpoint: http://opentelemetry-kube-stack-daemon-collector.opentelemetry-operator-system.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
    - b3
    - b3multi
    - jaeger
    - xray
    - ottrace
  sampler:
    type: parentbased_always_on
  env:
    - name: DD_AGENT_HOST
      value: "ddagent-kube-stack-datadog.opentelemetry-operator-system.svc.cluster.local"
    - name: DD_DBM_PROPAGATION_MODE
      value: "full"
    - name: DD_DBM_TRACE_PREPARED_STATEMENTS
      value: "true"
    - name: DD_ENV
      value: ""
    - name: DD_LOGS_OTEL_ENABLED
      value: "true"
    - name: DD_METRICS_OTEL_ENABLED
      value: "true"
    - name: DD_TRACE_OTEL_ENABLED
      value: "true"
    - name: DD_TRACE_OTEL_SEMANTICS_ENABLED
      value: "true"
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: "delta"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "http/protobuf"
    - name: OTEL_SEMCONV_STABILITY_OPT_IN
      value: "http,database,rpc,messaging"
    - name: OTEL_TRACES_EXPORTER
      value: "otlp"
  resource:
    addK8sUIDAttributes: true
    resourceAttributes:
      deployment.environment: production
      deployment.environment.name: production
  java:
    image: registry.ddbuild.io/ssi/dd-otel-autoinstrumentation-java:glci133182091
  nodejs:
    image: ghcr.io/cyrille-leclerc/dd-autoinstrumentation-nodejs:6.6.0
  python:
    image: ghcr.io/cyrille-leclerc/dd-autoinstrumentation-python:4.11.1
    volumeLimitSize: 500Mi
  dotnet:
    env:
    - name: CORECLR_PROFILER
      value: '{846F5F1C-F9AE-4B07-969E-05C26BC060D8}'
    - name: CORECLR_PROFILER_PATH
      value: /otel-auto-instrumentation-dotnet/linux/Datadog.Tracer.Native.so
    - name: DD_DOTNET_TRACER_HOME
      value: /otel-auto-instrumentation-dotnet
    image: ghcr.io/zacharycmontoya/dd-autoinstrumentation-dotnet:3.52.0

