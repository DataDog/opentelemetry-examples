# Overlay on top of the guide's values.yaml: enable the eBPF host profiler
# collector alongside the standard cluster and daemon collectors.
#
# Render (same invocation as `make generate-examples`):
#   helm template opentelemetry-kube-stack \
#     open-telemetry/opentelemetry-kube-stack --version 0.21.0 \
#     --namespace opentelemetry-operator-system \
#     --values ../../values.yaml --values values.yaml
collectors:
  host-profiler:
    enabled: true
