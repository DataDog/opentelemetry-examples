# DatadogAgent custom resource, reconciled by the Datadog Operator, configuring the
# Datadog Agent to run alongside the OpenTelemetry Kube Stack:
# the OTel collectors handle Kubernetes object/metrics monitoring and log collection,
# so cluster checks, orchestrator explorer, KSM core and process collection are disabled
# here to avoid duplicate collection.
#
# The Cluster Agent is kept: the node Agent relies on it for cluster-level metadata (node
# labels, Service/Endpoints tags) and the Operator doesn't fully support running without it.
# See https://github.com/DataDog/datadog-operator/issues/3521
kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
spec:
  global:
    # <DD_SITE> and the cluster name placeholder are substituted by the `install` script, which
    # removes the `clusterName` line on EKS/GKE/AKS so the Agent auto-detects the cluster name.
    clusterName: "<CLUSTER_NAME>"
    site: "<DD_SITE>"
    credentials:
      apiSecret:
        secretName: "datadog-secret"
        keyName: "api-key"
  features:
    clusterChecks:
      enabled: false
    orchestratorExplorer:
      enabled: false
    kubeStateMetricsCore:
      enabled: false
    liveProcessCollection:
      enabled: false
    processDiscovery:
      enabled: false
    eventCollection:
      collectKubernetesEvents: false
    # No log collection by the Agent: the OTel Kube Stack daemon collector handles logs.
    logCollection:
      enabled: false
    # No APM single-step (auto) instrumentation: SDKs are injected via the OTel Operator instead.
    apm:
      instrumentation:
        # CAN BE DISABLED WHEN INSTRUMENTING WITH THE OPENTELEMETRY OPERATOR, CAN BE ENABLED FOR HYBRID OTEL AND DATADOG
        # NATIVE INSTRUMENTATION. ENABLING DD INSTRUMENTATION REQUIRES EXCLUDING PODS THAT ARE INJECTED WITH OTEL SDKS
        # BY THE OPENTELEMETRY OPERATOR FROM DD INSTRUMENTATION, OTHERWISE THE SAME POD WILL BE INSTRUMENTED TWICE.
        #
        # The OpenTelemetry Operator marks pods for injection with the
        # "instrumentation.opentelemetry.io/inject-*" pod ANNOTATIONS, but the Datadog Operator
        # target's `podSelector` below only matches pod LABELS (it's a plain Kubernetes label
        # selector, and Datadog's admission controller only ever reads pod.Labels, never
        # pod.Annotations) — so a podSelector keyed on those annotation names can never
        # exclude anything. To exclude an OTel-instrumented pod template from Datadog
        # auto-instrumentation, add this label to it directly, alongside the OTel
        # annotations: `admission.datadoghq.com/enabled: "false"`. That label bypasses
        # Datadog's admission controller entirely, with no selector needed.
        enabled: false
        targets:
          - name: "default-target"
            ddTraceVersions:
              java: "1"
              python: "4"
              js: "5"
              php: "1"
              dotnet: "3"
              ruby: "2"
    # Live Debugger / Dynamic Instrumentation for Go apps: enables the system-probe Dynamic
    # Instrumentation module (sets DD_DYNAMIC_INSTRUMENTATION_ENABLED on the core agent and
    # system-probe containers)
    # See https://docs.datadoghq.com/tracing/live_debugger/?prog_lang=go
    # Known issue: on arm64 nodes running Linux >= 6.18 (e.g. Rancher Desktop on Apple Silicon),
    # Go probes fail to load with "invalid bpf_context access off=328 size=8" as the kernel's
    # struct pt_regs shrank. Use an x86_64 node or an older arm64 kernel (e.g. 6.12) meanwhile.
    # See https://github.com/DataDog/datadog-agent/issues/57314
    dynamicInstrumentation:
      enabled: true
  override:
    nodeAgent:
      # -jmx variant bundles a JRE so JMXFetch can run JMX checks (e.g. Kafka `ad.datadoghq.com/kafka.checks`).
      image:
        tag: "7.83.2-jmx"
      # Applied to all the node Agent containers (agent, trace-agent, system-probe).
      env:
        # JSON logs, easier to parse for the OTel collector tailing the container logs.
        - name: DD_LOG_FORMAT_JSON
          value: "true"
        # <HOSTNAME_FROM_NODE_NAME:BEGIN>
        # On non-cloud clusters, use "<Kubernetes node name>-<cluster name>" as the Agent hostname
        # (instead of the container runtime's hostname, e.g. the VM hostname on Rancher Desktop),
        # unique across clusters. K8S_NODE_NAME and K8S_CLUSTER_NAME must be defined before
        # DD_HOSTNAME for Kubernetes to expand them. Dropped by `install` on EKS/GKE/AKS where the
        # cloud provider hostname is preferred.
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_CLUSTER_NAME
          value: "<CLUSTER_NAME>"
        - name: DD_HOSTNAME
          value: "$(K8S_NODE_NAME)-$(K8S_CLUSTER_NAME)"
        # <HOSTNAME_FROM_NODE_NAME:END>
      containers:
        agent:
          env:
            - name: "DD_ORCHESTRATOR_EXPLORER_KUBELET_CONFIG_CHECK_ENABLED"
              value: "false"
            - name: "DD_DISCOVERY_ENABLED"
              value: "false"
            # Live Debugger requires `logs_enabled: true` or this override, as log collection is
            # disabled above.
            - name: "DD_APM_DEBUGGER_LOGS_ENABLED_OVERRIDE"
              value: "true"
            # The legacy `kubernetes_state` check's auto_conf.yaml autodiscovers the OTel Kube
            # Stack's kube-state-metrics pod and scrapes it, duplicating the Kubernetes object
            # metrics the OTel collectors already collect (hence `kubeStateMetricsCore` disabled above).
            - name: "DD_IGNORE_AUTOCONF"
              value: "kubernetes_state"
    clusterAgent:
      env:
        # JSON logs, easier to parse for the OTel collector tailing the container logs.
        - name: DD_LOG_FORMAT_JSON
          value: "true"
