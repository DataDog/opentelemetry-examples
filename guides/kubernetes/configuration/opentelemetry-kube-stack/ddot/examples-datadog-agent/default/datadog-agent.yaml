apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  features:
    apm:
      instrumentation:
        enabled: false
    clusterChecks:
      enabled: false
    dynamicInstrumentation:
      enabled: true
    eventCollection:
      collectKubernetesEvents: false
    kubeStateMetricsCore:
      enabled: false
    liveProcessCollection:
      enabled: false
    logCollection:
      enabled: false
    orchestratorExplorer:
      enabled: false
    processDiscovery:
      enabled: false
  global:
    clusterName: my-k8s-cluster
    credentials:
      apiSecret:
        keyName: api-key
        secretName: datadog-secret
    site: datadoghq.com
  override:
    clusterAgent:
      env:
      - name: DD_LOG_FORMAT_JSON
        value: "true"
    nodeAgent:
      containers:
        agent:
          env:
          - name: DD_ORCHESTRATOR_EXPLORER_KUBELET_CONFIG_CHECK_ENABLED
            value: "false"
          - name: DD_DISCOVERY_ENABLED
            value: "false"
          - name: DD_APM_DEBUGGER_LOGS_ENABLED_OVERRIDE
            value: "true"
          - name: DD_IGNORE_AUTOCONF
            value: kubernetes_state
      env:
      - name: DD_LOG_FORMAT_JSON
        value: "true"
      image:
        tag: 7.84.3-jmx
